<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sin conexión - Tienda de Libros</title>
	<link rel="stylesheet" href="./css/styles.css">
	<script>
		try {
			const guardado = localStorage.getItem("tema");
			const oscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
			if (guardado === "oscuro" || (!guardado && oscuro)) {
				document.documentElement.classList.add("dark");
			}
		} catch (e) {}
	</script>
</head>
<body>
	<nav class="navbar">
		<ul>
			<li><a href="index.html">Gestión</a></li>
			<li><a href="catalog.html">Catálogo</a></li>
		</ul>
	</nav>

	<h1>Sin conexión</h1>

	<div class="card">
		<p>No hay internet en este momento.</p>
		<p>El catálogo muestra los últimos datos guardados cuando están disponibles.</p>
		<p><a class="btn" href="catalog.html">Volver al catálogo</a></p>
	</div>
</body>
</html>
